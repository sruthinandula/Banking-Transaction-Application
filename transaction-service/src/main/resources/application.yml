server:
  port: 8080

spring:
  application:
    name: transaction-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bankdb}
    username: ${DB_USERNAME:bank}
    password: ${DB_PASSWORD:bank}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-0123456789}   # >= 32 chars
    expiration-minutes: 60
  kafka:
    topic: banking.transactions
    dlt-topic: banking.transactions.DLT
  outbox:
    poll-interval-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info
